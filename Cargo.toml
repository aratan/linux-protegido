[package]
name = "linux-protegido"
version = "0.1.0"
edition = "2021"
description = "Copias de seguridad verificables para Linux, coordinadas desde Rust y ejecutadas con Restic."
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
